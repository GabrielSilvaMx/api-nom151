psc:
  codex:
    base-url: https://api.psccodex.com # URL base de la API REST de PSC CODEX
    jwt-token: ${PSC_CODEX_JWT_TOKEN:eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9...} # Bearer Token[cite: 1]
    connect-timeout-ms: 5000
    read-timeout-ms: 10000

spring:
  datasource:
    # URL de conexión JDBC a MariaDB
    url: jdbc:mariadb://localhost:3306/psc_integration_db?useSSL=false&serverTimezone=UTC
    username: psc_user
    password: TuPasswordSeguro2026!
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Opciones: validate, update, create, none
    database-platform: org.hibernate.dialect.MariaDBDialect
    show-sql: true # Opcional: muestra las consultas SQL en los logs
    
resilience4j:
  retry:
    instances:
      pscClientRetry:
        max-attempts: 3
        wait-duration: 1000ms
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
          - java.util.concurrent.TimeoutException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException$BadRequest
          - org.springframework.web.client.HttpClientErrorException$Unauthorized
  circuitbreaker:
    instances:
      pscClientCircuitBreaker:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000ms
        permitted-number-of-calls-in-half-open-state: 3